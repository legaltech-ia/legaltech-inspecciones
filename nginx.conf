server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El router vive en el cliente: /expedientes no es un archivo, y sin esto
    # recargar esa ruta da 404 en vez de devolver el shell de la SPA.
    location / {
        try_files $uri /index.html;
    }

    # DNS de docker con TTL. Sin resolver + variable, nginx resuelve
    # "orchestrator" una sola vez al arrancar y se queda con una IP que cambia
    # cuando el BFF se reinicia.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $bff http://orchestrator:8080;
        proxy_pass $bff$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Subidas de expedientes y respuestas de IA: ni limite de tamano ni
        # corte a los 60 s por defecto.
        client_max_body_size 50m;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nginx:alpine trae "#gzip on;" comentado en su nginx.conf y nada en
    # conf.d/, asi que sin esto el bundle viaja en claro: ~5,2 MB de JS, que en
    # el enlace del inspector son decenas de segundos en la primera carga.
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json
               image/svg+xml font/woff font/woff2;

    # El router vive en el cliente: /expedientes no es un archivo, y sin esto
    # recargar esa ruta da 404 en vez de devolver el shell de la SPA.
    location / {
        try_files $uri /index.html;
    }

    # mime.types no trae "mjs", asi que el worker de pdf.js (1,25 MB, lo carga
    # cada vista de PDF y cada extraccion de comparendo) caia a
    # application/octet-stream y gzip no se disparaba nunca sobre el. Se corrige
    # con default_type en su propio location y NO con un bloque types{} aqui: un
    # types{} dentro de server REEMPLAZA el mapa heredado, y entonces los .js
    # dejan de comprimirse. Comprobado, no supuesto.
    location ~ \.mjs$ {
        default_type text/javascript;
    }

    # Los chunks llevan hash en el nombre; el shell no. Sin esto, tras una
    # reconstruccion el navegador puede servir un index.html viejo que apunta a
    # chunks que ya no existen.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # DNS de docker con TTL. Sin resolver + variable, nginx resuelve
    # "orchestrator" una sola vez al arrancar y se queda con una IP que cambia
    # cuando el BFF se reinicia.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $bff http://orchestrator:8080;
        proxy_pass $bff$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Subidas de expedientes y respuestas de IA: ni limite de tamano ni
        # corte a los 60 s por defecto.
        client_max_body_size 50m;
        proxy_read_timeout 300s;
    }
}
